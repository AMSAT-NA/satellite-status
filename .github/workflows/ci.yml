name: CI

on:
  workflow_call:
    # Only the secrets a CI check needs, passed explicitly by cd.yml (not
    # `secrets: inherit`): CI jobs run the PR's own code, so they don't get
    # the database password or deploy key.
    secrets:
      GPDATA_SYNC_TOKEN:
        required: false

jobs:

  # ── Which parts changed ──────────────────────────────────────────────────
  # Each test suite runs only when something it covers changed:
  #
  #   v1      frontend/v1, api (v1), their PHP tests and tools, Composer
  #   api-v2  api-v2
  #   db      db/ (schema, migrations): runs BOTH API suites, since both
  #           read the shared schema (api-v2's generated types included)
  #   smoke   the compose stack: any app, db/, or the compose files
  #
  # Changes to the workflows themselves, and manual runs, run everything.
  # Docs-only changes run none of the suites. frontend-v2 gets its own
  # filter when that project lands; it talks to the API, not the database,
  # so db/ changes won't need to run it. Nothing in the repo's ruleset
  # requires specific check names, so skipped jobs don't block a merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      v1: ${{ steps.decide.outputs.v1 }}
      api-v2: ${{ steps.decide.outputs.api_v2 }}
      db: ${{ steps.decide.outputs.db }}
      smoke: ${{ steps.decide.outputs.smoke }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            v1:
              - 'frontend/v1/**'
              - 'api/**'
              - 'tests/**'
              - 'tools/**'
              - 'composer.json'
              - 'composer.lock'
            api_v2:
              - 'api-v2/**'
            db:
              - 'db/**'
            compose:
              - 'docker-compose.yml'
              - 'deploy/**'
            workflows:
              - '.github/workflows/**'

      - name: Decide which suites run
        id: decide
        env:
          V1: ${{ steps.filter.outputs.v1 }}
          API_V2: ${{ steps.filter.outputs.api_v2 }}
          DB: ${{ steps.filter.outputs.db }}
          COMPOSE: ${{ steps.filter.outputs.compose }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          all=false
          if [ "$WORKFLOWS" = true ] || [ "$MANUAL" = true ]; then all=true; fi
          any() { for v in "$@"; do [ "$v" = true ] && { echo true; return; }; done; echo false; }
          {
            echo "v1=$(any "$V1" "$DB" "$all")"
            echo "api_v2=$(any "$API_V2" "$DB" "$all")"
            echo "db=$(any "$DB" "$all")"
            echo "smoke=$(any "$V1" "$API_V2" "$DB" "$COMPOSE" "$all")"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create package
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          REPO="${GITHUB_REPOSITORY##*/}"
          cd "$GITHUB_WORKSPACE/.."
          tar \
            --exclude="${REPO}/.git" \
            --exclude="${REPO}/.gitignore" \
            --exclude="${REPO}/.github" \
            --exclude="${REPO}/README.md" \
            -czf "/tmp/${SHORT_SHA}_package.tgz" \
            "${REPO}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ github.sha }}
          path: /tmp/*_package.tgz

  check-php-syntax:
    needs: check-php-version
    runs-on: ubuntu-latest
    container: php:${{ needs.check-php-version.outputs.php }}-alpine
    steps:
      - uses: actions/checkout@v6
      - name: Check PHP syntax
        run: find . -path './vendor' -prune -o -path './node_modules' -prune -o -name '*.php' -print -exec php -l {} \;

  # The PHP version every PHP job below runs on, read from the deploy
  # images, so CI tests exactly what production runs. Bumping PHP is then
  # only the two FROM lines (api/v1/Dockerfile, frontend/v1/Dockerfile); CI
  # follows automatically. Fails if the two images disagree.
  # Gates every v1 PHP job below: they all need it, so they're skipped
  # with it when nothing v1 changed.
  check-php-version:
    needs: changes
    if: needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.read.outputs.php }}
    steps:
      - uses: actions/checkout@v6
      - name: Read the PHP version from the deploy Dockerfiles
        id: read
        run: |
          read_version() {
            sed -nE 's/^FROM php:([0-9]+\.[0-9]+)-apache.*$/\1/p' "$1" | head -n1
          }
          API=$(read_version api/v1/Dockerfile)
          FRONTEND=$(read_version frontend/v1/Dockerfile)
          echo "api/v1/Dockerfile: php:${API:-?}-apache"
          echo "frontend/v1/Dockerfile: php:${FRONTEND:-?}-apache"
          if [ -z "$API" ] || [ "$API" != "$FRONTEND" ]; then
            echo "::error title=check-php-version::api and frontend images must both use FROM php:MAJOR.MINOR-apache with the same version"
            exit 1
          fi
          echo "php=$API" >> "$GITHUB_OUTPUT"

      - name: Confirm the CI image matches
        run: |
          docker run --rm "php:${{ steps.read.outputs.php }}-cli" php --version \
            | tee /dev/stderr | head -n1 | grep -q "^PHP ${{ steps.read.outputs.php }}\."

  # Issue #24 follow-up: guards against a *new* raw DB connection being
  # added without the UTC time_zone pin every connection needs (see
  # tools/check-timezone-pins.php's header comment for the full
  # rationale and its documented, deliberately-imperfect heuristic).
  # Diff-only by design -- fetch-depth: 0 so there's real history to
  # diff a merge-base against, matching the `changes` job in cd.yml.
  check-timezone-pins:
    needs: check-php-version
    runs-on: ubuntu-latest
    container: php:${{ needs.check-php-version.outputs.php }}-alpine
    steps:
      # php:alpine has no git by default. actions/checkout falls back to
      # the GitHub REST API without it, which can only hand back a single
      # commit's file tree -- no real history, so fetch-depth: 0 wouldn't
      # actually provide anything to diff against. Install git first so
      # checkout does a real clone.
      - name: Install git
        run: |
          apk add --no-cache git
          # The checkout below is actually performed by the runner's own
          # git (host-side), then bind-mounted in -- but this container's
          # freshly-installed git still needs to operate on that same
          # path for the diff step further down, and it isn't the owner
          # of those files. Without this, git 2.35+ refuses with a
          # "dubious ownership" style error (git diff's three-dot ref
          # resolution surfaces it as "Could not access '<ref>...<ref>'"
          # specifically). Safe here since this is a throwaway CI
          # container, not a shared/multi-tenant machine.
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for unpinned raw DB connections added in this change
        run: php tools/check-timezone-pins.php

  # Issue #25: the GP feed address has no default in the code; it lives only
  # in the GPDATA_FEED_URL repository variable (Settings > Secrets and
  # variables > Actions > Variables), which CD writes to the server's .env.
  # This fails CI if the variable is empty, isn't https, or doesn't serve a
  # feed the sync would accept -- checked with the sync's own validation
  # (tools/check-gpdata-feed.php). Note: it depends on the live feed being
  # reachable, so a feed outage fails CI too; that's intended, since
  # deploying against a dead feed would sync nothing.
  check-gpdata-feed:
    needs: check-php-version
    runs-on: ubuntu-latest
    container: php:${{ needs.check-php-version.outputs.php }}-cli
    env:
      GPDATA_FEED_URL: ${{ vars.GPDATA_FEED_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: GPDATA_FEED_URL is set and serves a valid GP feed
        run: php tools/check-gpdata-feed.php

      # The token for POST /api/v1/gpdata-sync.php and the admin "Sync now"
      # button (repository secret, written to .env by CD). Without it the
      # daily sync still runs, but on-demand sync returns 503 -- most likely
      # discovered mid-launch, so check it here. Only its presence and
      # length are checked; the value is never printed (and GitHub masks it).
      - name: GPDATA_SYNC_TOKEN is set
        env:
          GPDATA_SYNC_TOKEN: ${{ secrets.GPDATA_SYNC_TOKEN }}
        run: |
          if [ -z "$GPDATA_SYNC_TOKEN" ]; then
            echo "::error title=check-gpdata-feed::GPDATA_SYNC_TOKEN is not set. Add the repository secret (Settings > Secrets and variables > Actions > Secrets); generate with: openssl rand -hex 32"
            exit 1
          fi
          if [ "${#GPDATA_SYNC_TOKEN}" -lt 32 ]; then
            echo "::error title=check-gpdata-feed::GPDATA_SYNC_TOKEN is shorter than 32 characters. Regenerate with: openssl rand -hex 32"
            exit 1
          fi
          echo "OK: GPDATA_SYNC_TOKEN is set (${#GPDATA_SYNC_TOKEN} characters)."

  composer-platform:
    needs: check-php-version
    runs-on: ubuntu-latest
    container: php:${{ needs.check-php-version.outputs.php }}-cli
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          apt-get update -yqq
          apt-get install -yqq --no-install-recommends git unzip
          curl -sS https://getcomposer.org/installer | php -- --quiet
          php composer.phar install --no-progress --no-interaction
      - name: Check platform requirements
        run: php composer.phar check-platform-reqs

      - name: openapi.json is up to date with openapi_spec.php
        # The served OpenAPI document is generated (composer openapi) and
        # committed. Regenerate it and fail if the committed copy differs,
        # so the spec can't drift from its source. Added after #57, whose
        # openapi.json was produced without swagger-php and came out in a
        # different key order.
        # Compares file contents directly (not git diff): inside the CI
        # container git can report a stat-only change as a difference.
        run: |
          cp api/v1/openapi.json /tmp/openapi.committed.json
          php composer.phar run openapi
          if ! cmp -s /tmp/openapi.committed.json api/v1/openapi.json; then
            diff -u /tmp/openapi.committed.json api/v1/openapi.json | tee /tmp/openapi.diff
            # Surface the diff in the run summary as an annotation too.
            echo "::error title=openapi.json is stale::Run 'composer openapi' and commit api/v1/openapi.json. Diff: $(head -c 3000 /tmp/openapi.diff | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          fi

  phpunit:
    needs: check-php-version
    runs-on: ubuntu-latest
    container: php:${{ needs.check-php-version.outputs.php }}-cli
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testrootpw
          MARIADB_DATABASE: satstatus
          MARIADB_USER: satstatus
          MARIADB_PASSWORD: satstatus
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_BASE_URL: "http://127.0.0.1:8000"
      TEST_DB_HOST: mariadb
      TEST_DB_PORT: "3306"
      TEST_DB_USER: satstatus
      TEST_DB_PASS: satstatus
      TEST_DB_NAME: satstatus
      # Issue #25: the gpdata-sync endpoint and admin "Sync now" button are
      # enabled with this token in tests. GPDATA_FEED_URL is set when the
      # dev server starts (it needs the container's absolute workspace path).
      GPDATA_SYNC_TOKEN: test-sync-token
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get update -yqq
          apt-get install -yqq --no-install-recommends git unzip default-mysql-client
          docker-php-ext-install mysqli

      - name: Wait for MariaDB
        run: until mysql -h mariadb -usatstatus -psatstatus -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done

      - name: Load schema
        run: mysql -h mariadb -usatstatus -psatstatus satstatus < db/schema.sql

      - name: Install Composer dependencies
        run: |
          curl -sS https://getcomposer.org/installer | php -- --quiet
          php composer.phar install --no-progress --no-interaction

      - name: Start PHP dev server
        run: |
          cp tests/fixtures/config.test.php frontend/v1/config.php
          cp tests/fixtures/config.test.php api/v1/config.php
          # PHP_CLI_SERVER_WORKERS > 1 is required here: submit.php (Issue
          # #24) now makes an outbound HTTP call back to this same server
          # to reach /api/v1/reports.php. The built-in dev server handles
          # only one request at a time by default, which would deadlock
          # that request against the one that triggered it.
          GPDATA_FEED_URL="$PWD/tests/fixtures/gpdata/daily-bulletin.json" \
            PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8000 -t . tests/fixtures/router.php >/tmp/php-server.log 2>&1 &
          until curl -sS -o /dev/null http://127.0.0.1:8000/; do sleep 1; done

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration tests/phpunit.xml --colors=never

      - name: Upload PHP server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-php-server-log
          path: /tmp/php-server.log
          retention-days: 7

  # api-v2 (TypeScript, docs/agents/api-v2-stack.md): typecheck, generated
  # database types in sync with db/schema.sql, build, and tests against a
  # real MariaDB loaded with the same schema PHPUnit uses.
  api-v2:
    needs: changes
    if: needs.changes.outputs.api-v2 == 'true'
    runs-on: ubuntu-latest
    container: node:26-bookworm-slim
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testrootpw
          MARIADB_DATABASE: satstatus
          MARIADB_USER: satstatus
          MARIADB_PASSWORD: satstatus
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DB_HOST: mariadb
      TEST_DB_PORT: "3306"
      TEST_DB_USER: satstatus
      TEST_DB_PASS: satstatus
      TEST_DB_NAME: satstatus
      DATABASE_URL: mysql://satstatus:satstatus@mariadb:3306/satstatus
    defaults:
      run:
        working-directory: api-v2
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        working-directory: .
        run: |
          apt-get update -yqq
          apt-get install -yqq --no-install-recommends mariadb-client

      - name: Wait for MariaDB and load the schema
        working-directory: .
        run: |
          until mariadb -h mariadb -usatstatus -psatstatus --skip-ssl -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done
          mariadb -h mariadb -usatstatus -psatstatus --skip-ssl satstatus < db/schema.sql

      # One-time bootstrap: the lockfile and generated types are produced
      # here when missing, printed to the log, then committed.
      - name: Bootstrap lockfile and database types (only when missing)
        run: |
          if [ -f package-lock.json ]; then exit 0; fi
          npm install --no-audit --no-fund
          echo "----- BEGIN package-lock.json (gzip+base64) -----"
          gzip -9c package-lock.json | base64 -w0; echo
          echo "----- END package-lock.json -----"
          npm run db:types
          echo "----- BEGIN src/db/types.ts (gzip+base64) -----"
          gzip -9c src/db/types.ts | base64 -w0; echo
          echo "----- END src/db/types.ts -----"
          echo "::error title=api-v2::package-lock.json is missing; commit the generated one above."
          exit 1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Database types match db/schema.sql
        run: |
          cp src/db/types.ts /tmp/types.committed.ts
          npm run db:types
          if ! diff -u /tmp/types.committed.ts src/db/types.ts; then
            echo "::error title=api-v2::src/db/types.ts is out of date with db/schema.sql. Run npm run db:types against a database loaded with db/schema.sql and commit the result (the diff above)."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Runs in the deploy PHP version's official image (it used to run in the
  # Playwright image with Ubuntu's PHP 8.3 while production ran 8.5). Node
  # and Chromium are installed here instead.
  playwright:
    needs: check-php-version
    runs-on: ubuntu-latest
    container: php:${{ needs.check-php-version.outputs.php }}-cli
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testrootpw
          MARIADB_DATABASE: satstatus
          MARIADB_USER: satstatus
          MARIADB_PASSWORD: satstatus
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:8000"
      TEST_BASE_URL: "http://127.0.0.1:8000"
      TEST_DB_HOST: mariadb
      TEST_DB_PORT: "3306"
      TEST_DB_USER: satstatus
      TEST_DB_PASS: satstatus
      TEST_DB_NAME: satstatus
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get update -yqq
          apt-get install -yqq --no-install-recommends curl default-mysql-client git unzip nodejs npm
          docker-php-ext-install mysqli
          php --version | head -n1
          node --version

      - name: Wait for MariaDB
        run: until mysql -h mariadb -usatstatus -psatstatus -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done

      - name: Load schema
        run: mysql -h mariadb -usatstatus -psatstatus satstatus < db/schema.sql

      - name: Load seed data
        run: mysql -h mariadb -usatstatus -psatstatus satstatus < db/seed.sql

      - name: Install Composer dependencies
        run: |
          curl -sS https://getcomposer.org/installer | php -- --quiet
          php composer.phar install --no-progress --no-interaction

      - name: Start PHP dev server
        run: |
          cp tests/fixtures/config.test.php frontend/v1/config.php
          cp tests/fixtures/config.test.php api/v1/config.php
          # See the phpunit job's identical step for why PHP_CLI_SERVER_WORKERS
          # is required: submit.php calls back into this same server to reach
          # the API (Issue #24), which deadlocks a single-worker dev server.
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8000 -t . tests/fixtures/router.php >php-server.log 2>&1 &
          until curl -sS -o /dev/null http://127.0.0.1:8000/; do sleep 1; done

      - name: Install Node dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --config tests/playwright.config.js

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            php-server.log
            playwright-report/
            test-results/
          retention-days: 7

  migration-dry-run:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    # Runs EVERY forward production migration in db/migrations/ (in file-
    # name order: #24's 2026_08_08_*, then #25's 2026_11_11_*, ...) against
    # the pre-#24 schema on the production MariaDB version, then proves the
    # result matches db/schema.sql. MigrationBackfillTest only
    # exercises the backfill UPDATE; this covers the ALTERs, the NOT NULL
    # step, the indexes, and what happens to existing rows. The fixture
    # snapshot in tests/fixtures/pre-issue-24/ is the schema dallas190's
    # dump will have when it's loaded onto azure193 at cutover.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start MariaDB (production version, no server time zone flag -- as azure193 runs before this PR deploys)
        run: |
          docker run -d --name mig -e MARIADB_ROOT_PASSWORD=pw mariadb:12.3
          until docker exec mig mariadb -uroot -ppw -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done

      - name: Load pre-#24 schema + seed, plus sentinel rows
        run: |
          docker exec mig mariadb -uroot -ppw -e "CREATE DATABASE pre; CREATE DATABASE fresh;"
          docker exec -i mig mariadb -uroot -ppw pre < tests/fixtures/pre-issue-24/schema.sql
          docker exec -i mig mariadb -uroot -ppw pre < tests/fixtures/pre-issue-24/seed.sql
          # period = -1 (the 53 known production rows), NULL period, and a
          # 1970-01-01 / hour 0 / period 0 row: the exact kind of row that
          # stopped the 4 Nov production run (below the TIMESTAMP minimum).
          docker exec mig mariadb -uroot -ppw pre -e "
            INSERT INTO satellite (name, longname, day, hour, period, callsign, report)
            VALUES ('AO-91','AO-91','2020-03-01',14,-1,'W1AW','Heard'),
                   ('AO-91','AO-91','2020-03-01',15,NULL,'W1AW','Heard'),
                   ('AO-91','AO-91','1970-01-01',0,0,'ZZ1970','Heard');"
          # step 0 removes pre-1970-01-02 rows, so they don't count toward "preserved"
          docker exec mig mariadb -uroot -ppw -N pre -e "SELECT COUNT(*) FROM satellite WHERE day >= '1970-01-02'" > /tmp/pre_count

      - name: Run all forward migrations, in order
        run: |
          for mig in $(ls db/migrations/*.sql | grep -v '_rollback\.sql$' | sort); do
            echo "== $mig"
            docker exec -i mig mariadb -uroot -ppw pre < "$mig"
          done

      - name: Migrated table structure matches db/schema.sql
        run: |
          docker exec -i mig mariadb -uroot -ppw fresh < db/schema.sql
          # Every table in db/schema.sql, so a new table can't be missed. The
          # migrated DB may also hold archive tables db/schema.sql doesn't
          # define (e.g. #24's pre_1970_rows_removed); those are ignored.
          docker exec mig mariadb -uroot -ppw -N fresh -e "SHOW TABLES" > /tmp/tables
          for t in $(cat /tmp/tables); do
            for db in pre fresh; do
              docker exec mig mariadb -uroot -ppw -N -e "SHOW CREATE TABLE $db.$t" \
                | cut -f2- | sed -E 's/ AUTO_INCREMENT=[0-9]+//' > /tmp/$db.$t.sql
            done
            echo "== $t"; diff /tmp/pre.$t.sql /tmp/fresh.$t.sql
          done

      - name: Existing rows are intact and backfilled correctly
        run: |
          q() { docker exec mig mariadb -uroot -ppw -N pre -e "SET time_zone='+00:00'; $1"; }
          fail=0
          check() { # label, actual, expected
            if [ "$2" = "$3" ]; then echo "ok: $1 = $2"; else echo "::error title=migration-dry-run::$1: got '$2', expected '$3'"; fail=1; fi
          }
          check "row count preserved (minus pre-1970 rows)" "$(q 'SELECT COUNT(*) FROM satellite')" "$(cat /tmp/pre_count)"
          check "pre-1970 rows removed" "$(q "SELECT COUNT(*) FROM satellite WHERE callsign='ZZ1970'")" "0"
          check "observation_time NULL rows" "$(q 'SELECT COUNT(*) FROM satellite WHERE observation_time IS NULL')" "0"
          # Historical rows have no honest receive time: submission_time must be NULL
          check "historical rows with submission_time set" "$(q 'SELECT COUNT(*) FROM satellite WHERE submission_time IS NOT NULL')" "0"
          check "period=-1 row backfill" "$(q "SELECT observation_time FROM satellite WHERE callsign='W1AW' AND hour=14")" "2020-03-01 14:00:00"
          check "period=NULL row backfill" "$(q "SELECT observation_time FROM satellite WHERE callsign='W1AW' AND hour=15")" "2020-03-01 15:00:00"
          exit $fail

      - name: New inserts behave as the app expects
        run: |
          q() { docker exec mig mariadb -uroot -ppw -N pre -e "SET time_zone='+00:00'; $1"; }
          q "INSERT INTO satellite (name, longname, callsign, report, grid_square, observation_time)
             VALUES ('AO-91','AO-91','ZZ9MIG','Heard','FN31','2026-11-04 14:05:00')"
          got="$(q "SELECT CONCAT_WS(',', day IS NULL, hour IS NULL, period IS NULL, submission_time IS NOT NULL) FROM satellite WHERE callsign='ZZ9MIG'")"
          [ "$got" = "1,1,1,1" ] || { echo "::error title=migration-dry-run::new insert: got '$got', expected '1,1,1,1' (day/hour/period NULL, submission_time set)"; exit 1; }

  docker-compose-smoke:
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    env:
      # Production-shaped value (single host, https, no port) so the
      # SITE_URL correctness checks below prove the app builds correct
      # URLs for a real deploy, not just for local-dev's per-port defaults.
      SITE_URL: https://status.amsat.org
      # Issue #25: a token so the gpdata-sync checks below can call the
      # endpoint through real Apache, and a feed location inside the
      # container that isn't JSON, so the run deterministically aborts
      # without CI depending on the external feed.
      GPDATA_SYNC_TOKEN: smoke-test-token
      GPDATA_FEED_URL: /etc/hostname
    steps:
      - uses: actions/checkout@v6

      - name: Create traefik-public network
        run: docker network create traefik-public

      - name: Build and start stack
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Smoke-test frontend (2xx response)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "Frontend HTTP status: $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]

      - name: Smoke-test API health (DB connectivity confirmed)
        run: |
          BODY=$(curl -sf http://localhost:8081/api/v1/health.php)
          echo "$BODY"
          echo "$BODY" | jq -e '.data.status == "ok"'

      - name: Smoke-test api-v2 health (built image, DB connectivity)
        run: |
          BODY=$(curl -sf http://localhost:8082/api/v2/health)
          echo "$BODY"
          echo "$BODY" | jq -e '.status == "ok" and .database == "ok"'

      - name: Smoke-test API data endpoint (schema seeded)
        run: |
          BODY=$(curl -sf http://localhost:8081/api/v1/satellites.php)
          echo "$BODY" | head -c 500
          echo "$BODY" | jq -e 'type == "array" and length > 0'

      - name: Smoke-test DB server default timezone (UTC with no client-side SET)
        run: |
          # Issue #24 follow-up: distinct from tests/TimezonePinningTest.php,
          # which proves the app's own connections *request* UTC via
          # `SET time_zone`. This proves the *server's own default* is UTC
          # -- a connection would still get UTC here even if it somehow
          # lacked that explicit pin. No SET is issued in this query.
          #
          # MYSQL_PWD (not -p<password>) so the client doesn't emit its
          # "using a password on the command line" warning -- which would
          # otherwise land in this same captured output and break the
          # exact-match comparison below.
          TZ=$(MYSQL_PWD=root mysql -h 127.0.0.1 -P 3307 -u root --silent --skip-column-names -e "SELECT @@global.time_zone;")
          echo "Server @@global.time_zone: $TZ"
          [ "$TZ" = "+00:00" ]

      - name: Smoke-test SITE_URL correctness (self-links match the production URL exactly)
        run: |
          BODY=$(curl -sf "http://localhost:8081/api/v1/catalog.php?name=AO-91")
          echo "$BODY"
          SELF=$(echo "$BODY" | jq -r '.data[0].links.self')
          echo "Self link: $SELF"
          [ "$SELF" = "${SITE_URL}/api/v1/catalog.php?name=AO-91" ]

      - name: Smoke-test gpdata-sync wiring in the API image (Issue #25)
        # Only the built image can prove these: the pinned scheduler binary
        # and crontab, setpriv for dropping to www-data, the CLI job living
        # outside the web root, and Apache passing the Authorization header
        # through to PHP.
        run: |
          docker compose exec -T api supercronic -test /etc/satellite-status/crontab
          docker compose exec -T api setpriv --version
          docker compose exec -T api test -f /opt/satellite-status/bin/gpdata-sync.php

          code() { curl -s -o /tmp/sync.json -w "%{http_code}" "$@"; }
          URL=http://localhost:8081/api/v1/gpdata-sync.php

          for P in /api/bin/gpdata-sync.php /api/v1/docker/bin/gpdata-sync.php; do
            S=$(code "http://localhost:8081$P")
            echo "CLI job over HTTP ($P): $S"; [ "$S" = "404" ]
          done

          S=$(code -X POST "$URL")
          echo "no token: $S"; cat /tmp/sync.json; [ "$S" = "401" ]

          S=$(code -X POST -H "Authorization: Bearer wrong" "$URL")
          echo "wrong token: $S"; [ "$S" = "401" ]

          S=$(code -X POST -H "Authorization: Bearer $GPDATA_SYNC_TOKEN" "$URL")
          echo "right token: $S"; cat /tmp/sync.json
          [ "$S" = "200" ]
          jq -e '.data.status == "aborted" and .data.trigger == "manual" and (.data.reason | test("JSON"))' /tmp/sync.json

          # The scheduled entry point, run by hand the way supercronic runs it
          # (exit 2 = aborted, as expected with this feed).
          docker compose exec -T -u www-data api php /opt/satellite-status/bin/gpdata-sync.php || [ $? -eq 2 ]

      - name: Smoke-test /api front door (real Apache, not the PHP dev server)
        # The PHPUnit harness can't exercise Apache config, so this is the
        # only check that the AliasMatch for /api and /api/ to
        # api/v1/api-root.php in api/v1/Dockerfile works. Bare /api must answer 200
        # directly -- a 301 here means mod_dir is redirecting, which behind
        # Traefik becomes an http:// hop.
        run: |
          for P in /api /api/; do
            STATUS=$(curl -s -o /tmp/api-root.json -w "%{http_code}" "http://localhost:8081$P")
            echo "$P -> HTTP $STATUS"
            cat /tmp/api-root.json
            [ "$STATUS" = "200" ]
            jq -e --arg u "${SITE_URL}/api/v1/" '.data.versions[] | select(.version == "v1") | .url == $u' /tmp/api-root.json
          done
          # Build files must not be fetchable from the web root.
          for P in /api/Dockerfile /api/.dockerignore /api/v1/Dockerfile /api/v1/.dockerignore /api/v1/docker/crontab /api/v1/docker/docker-entrypoint.sh; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8081$P")
            echo "$P -> HTTP $STATUS"
            [ "$STATUS" = "404" ]
          done

      - name: Smoke-test SITE_URL portability (a different SITE_URL isn't hardcoded away)
        env:
          SITE_URL: https://example.org
        timeout-minutes: 5
        run: |
          docker compose up -d --wait
          BODY=$(curl -sf "http://localhost:8081/api/v1/catalog.php?name=AO-91")
          echo "$BODY"
          SELF=$(echo "$BODY" | jq -r '.data[0].links.self')
          echo "Self link: $SELF"
          [ "$SELF" = "${SITE_URL}/api/v1/catalog.php?name=AO-91" ]

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker network rm traefik-public || true
