name: CI

on:
  workflow_call:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create package
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          REPO="${GITHUB_REPOSITORY##*/}"
          cd "$GITHUB_WORKSPACE/.."
          tar \
            --exclude="${REPO}/.git" \
            --exclude="${REPO}/.gitignore" \
            --exclude="${REPO}/.github" \
            --exclude="${REPO}/README.md" \
            -czf "/tmp/${SHORT_SHA}_package.tgz" \
            "${REPO}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ github.sha }}
          path: /tmp/*_package.tgz

  check-php-syntax:
    runs-on: ubuntu-latest
    container: php:alpine
    steps:
      - uses: actions/checkout@v6
      - name: Check PHP syntax
        run: find . -path './vendor' -prune -o -path './node_modules' -prune -o -name '*.php' -print -exec php -l {} \;

  check-php-version:
    runs-on: ubuntu-latest
    container: php:alpine
    steps:
      - uses: actions/checkout@v6
      - name: Check PHP version
        run: php --version

  # Issue #24 follow-up: guards against a *new* raw DB connection being
  # added without the UTC time_zone pin every connection needs (see
  # tools/check-timezone-pins.php's header comment for the full
  # rationale and its documented, deliberately-imperfect heuristic).
  # Diff-only by design -- fetch-depth: 0 so there's real history to
  # diff a merge-base against, matching the `changes` job in cd.yml.
  check-timezone-pins:
    runs-on: ubuntu-latest
    container: php:alpine
    steps:
      # php:alpine has no git by default. actions/checkout falls back to
      # the GitHub REST API without it, which can only hand back a single
      # commit's file tree -- no real history, so fetch-depth: 0 wouldn't
      # actually provide anything to diff against. Install git first so
      # checkout does a real clone.
      - name: Install git
        run: |
          apk add --no-cache git
          # The checkout below is actually performed by the runner's own
          # git (host-side), then bind-mounted in -- but this container's
          # freshly-installed git still needs to operate on that same
          # path for the diff step further down, and it isn't the owner
          # of those files. Without this, git 2.35+ refuses with a
          # "dubious ownership" style error (git diff's three-dot ref
          # resolution surfaces it as "Could not access '<ref>...<ref>'"
          # specifically). Safe here since this is a throwaway CI
          # container, not a shared/multi-tenant machine.
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for unpinned raw DB connections added in this change
        run: php tools/check-timezone-pins.php

  composer-platform:
    runs-on: ubuntu-latest
    container: php:cli
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          apt-get update -yqq
          apt-get install -yqq --no-install-recommends git unzip
          curl -sS https://getcomposer.org/installer | php -- --quiet
          php composer.phar install --no-progress --no-interaction
      - name: Check platform requirements
        run: php composer.phar check-platform-reqs

  phpunit:
    runs-on: ubuntu-latest
    container: php:cli
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testrootpw
          MARIADB_DATABASE: satstatus
          MARIADB_USER: satstatus
          MARIADB_PASSWORD: satstatus
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_BASE_URL: "http://127.0.0.1:8000"
      TEST_DB_HOST: mariadb
      TEST_DB_PORT: "3306"
      TEST_DB_USER: satstatus
      TEST_DB_PASS: satstatus
      TEST_DB_NAME: satstatus
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get update -yqq
          apt-get install -yqq --no-install-recommends git unzip default-mysql-client
          docker-php-ext-install mysqli

      - name: Wait for MariaDB
        run: until mysql -h mariadb -usatstatus -psatstatus -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done

      - name: Load schema
        run: mysql -h mariadb -usatstatus -psatstatus satstatus < db/schema.sql

      - name: Install Composer dependencies
        run: |
          curl -sS https://getcomposer.org/installer | php -- --quiet
          php composer.phar install --no-progress --no-interaction

      - name: Start PHP dev server
        run: |
          cp tests/fixtures/config.test.php frontend/v1/config.php
          cp tests/fixtures/config.test.php api/v1/config.php
          # PHP_CLI_SERVER_WORKERS > 1 is required here: submit.php (Issue
          # #24) now makes an outbound HTTP call back to this same server
          # to reach /api/v1/reports.php. The built-in dev server handles
          # only one request at a time by default, which would deadlock
          # that request against the one that triggered it.
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8000 -t . tests/fixtures/router.php >/tmp/php-server.log 2>&1 &
          until curl -sS -o /dev/null http://127.0.0.1:8000/; do sleep 1; done

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration tests/phpunit.xml --colors=never

      - name: Upload PHP server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-php-server-log
          path: /tmp/php-server.log
          retention-days: 7

  playwright:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testrootpw
          MARIADB_DATABASE: satstatus
          MARIADB_USER: satstatus
          MARIADB_PASSWORD: satstatus
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:8000"
      TEST_BASE_URL: "http://127.0.0.1:8000"
      TEST_DB_HOST: mariadb
      TEST_DB_PORT: "3306"
      TEST_DB_USER: satstatus
      TEST_DB_PASS: satstatus
      TEST_DB_NAME: satstatus
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get update -yqq
          apt-get install -yqq --no-install-recommends curl default-mysql-client git php-cli php-mbstring php-mysql php-xml unzip

      - name: Wait for MariaDB
        run: until mysql -h mariadb -usatstatus -psatstatus -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done

      - name: Load schema
        run: mysql -h mariadb -usatstatus -psatstatus satstatus < db/schema.sql

      - name: Load seed data
        run: mysql -h mariadb -usatstatus -psatstatus satstatus < db/seed.sql

      - name: Install Composer dependencies
        run: |
          curl -sS https://getcomposer.org/installer | php -- --quiet
          php composer.phar install --no-progress --no-interaction

      - name: Start PHP dev server
        run: |
          cp tests/fixtures/config.test.php frontend/v1/config.php
          cp tests/fixtures/config.test.php api/v1/config.php
          # See the phpunit job's identical step for why PHP_CLI_SERVER_WORKERS
          # is required: submit.php calls back into this same server to reach
          # the API (Issue #24), which deadlocks a single-worker dev server.
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8000 -t . tests/fixtures/router.php >php-server.log 2>&1 &
          until curl -sS -o /dev/null http://127.0.0.1:8000/; do sleep 1; done

      - name: Install Node dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npx playwright test --config tests/playwright.config.js

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            php-server.log
            playwright-report/
            test-results/
          retention-days: 7

  migration-dry-run:
    # Runs the WHOLE production migration (db/migrations/2026_08_08_*)
    # against the pre-#24 schema on the production MariaDB version, then
    # proves the result matches db/schema.sql. MigrationBackfillTest only
    # exercises the backfill UPDATE; this covers the ALTERs, the NOT NULL
    # step, the indexes, and what happens to existing rows. The fixture
    # snapshot in tests/fixtures/pre-issue-24/ is the schema dallas190's
    # dump will have when it's loaded onto azure193 at cutover.
    runs-on: ubuntu-latest
    env:
      MIG: db/migrations/2026_08_08_add_observation_time_submission_time.sql
    steps:
      - uses: actions/checkout@v6

      - name: Start MariaDB (production version, no server time zone flag -- as azure193 runs before this PR deploys)
        run: |
          docker run -d --name mig -e MARIADB_ROOT_PASSWORD=pw mariadb:12.3
          until docker exec mig mariadb -uroot -ppw -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done

      - name: Load pre-#24 schema + seed, plus sentinel rows
        run: |
          docker exec mig mariadb -uroot -ppw -e "CREATE DATABASE pre; CREATE DATABASE fresh;"
          docker exec -i mig mariadb -uroot -ppw pre < tests/fixtures/pre-issue-24/schema.sql
          docker exec -i mig mariadb -uroot -ppw pre < tests/fixtures/pre-issue-24/seed.sql
          # period = -1 (the 53 known production rows) and NULL period
          docker exec mig mariadb -uroot -ppw pre -e "
            INSERT INTO satellite (name, longname, day, hour, period, callsign, report)
            VALUES ('AO-91','AO-91','2020-03-01',14,-1,'W1AW','Heard'),
                   ('AO-91','AO-91','2020-03-01',15,NULL,'W1AW','Heard');"
          docker exec mig mariadb -uroot -ppw -N pre -e "SELECT COUNT(*) FROM satellite" > /tmp/pre_count

      - name: Run the full migration
        run: docker exec -i mig mariadb -uroot -ppw pre < "$MIG"

      - name: Migrated table structure matches db/schema.sql
        run: |
          docker exec -i mig mariadb -uroot -ppw fresh < db/schema.sql
          for t in satellite satellite_name users; do
            for db in pre fresh; do
              docker exec mig mariadb -uroot -ppw -N -e "SHOW CREATE TABLE $db.$t" \
                | cut -f2- | sed -E 's/ AUTO_INCREMENT=[0-9]+//' > /tmp/$db.$t.sql
            done
            echo "== $t"; diff /tmp/pre.$t.sql /tmp/fresh.$t.sql
          done

      - name: Existing rows are intact and backfilled correctly
        run: |
          q() { docker exec mig mariadb -uroot -ppw -N pre -e "SET time_zone='+00:00'; $1"; }
          fail=0
          check() { # label, actual, expected
            if [ "$2" = "$3" ]; then echo "ok: $1 = $2"; else echo "::error title=migration-dry-run::$1: got '$2', expected '$3'"; fail=1; fi
          }
          check "row count preserved" "$(q 'SELECT COUNT(*) FROM satellite')" "$(cat /tmp/pre_count)"
          check "observation_time NULL rows" "$(q 'SELECT COUNT(*) FROM satellite WHERE observation_time IS NULL')" "0"
          # Historical rows have no honest receive time: submission_time must be NULL
          check "historical rows with submission_time set" "$(q 'SELECT COUNT(*) FROM satellite WHERE submission_time IS NOT NULL')" "0"
          check "period=-1 row backfill" "$(q "SELECT observation_time FROM satellite WHERE callsign='W1AW' AND hour=14")" "2020-03-01 14:00:00"
          check "period=NULL row backfill" "$(q "SELECT observation_time FROM satellite WHERE callsign='W1AW' AND hour=15")" "2020-03-01 15:00:00"
          exit $fail

      - name: New inserts behave as the app expects
        run: |
          q() { docker exec mig mariadb -uroot -ppw -N pre -e "SET time_zone='+00:00'; $1"; }
          q "INSERT INTO satellite (name, longname, callsign, report, grid_square, observation_time)
             VALUES ('AO-91','AO-91','K1ABC','Heard','FN31','2026-11-04 14:05:00')"
          got="$(q "SELECT CONCAT_WS(',', day IS NULL, hour IS NULL, period IS NULL, submission_time IS NOT NULL) FROM satellite WHERE callsign='K1ABC'")"
          [ "$got" = "1,1,1,1" ] || { echo "::error title=migration-dry-run::new insert: got '$got', expected '1,1,1,1' (day/hour/period NULL, submission_time set)"; exit 1; }

  docker-compose-smoke:
    runs-on: ubuntu-latest
    env:
      # Production-shaped value (single host, https, no port) so the
      # SITE_URL correctness checks below prove the app builds correct
      # URLs for a real deploy, not just for local-dev's per-port defaults.
      SITE_URL: https://status.amsat.org
    steps:
      - uses: actions/checkout@v6

      - name: Create traefik-public network
        run: docker network create traefik-public

      - name: Build and start stack
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Smoke-test frontend (2xx response)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "Frontend HTTP status: $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]

      - name: Smoke-test API health (DB connectivity confirmed)
        run: |
          BODY=$(curl -sf http://localhost:8081/api/v1/health.php)
          echo "$BODY"
          echo "$BODY" | jq -e '.data.status == "ok"'

      - name: Smoke-test API data endpoint (schema seeded)
        run: |
          BODY=$(curl -sf http://localhost:8081/api/v1/satellites.php)
          echo "$BODY" | head -c 500
          echo "$BODY" | jq -e 'type == "array" and length > 0'

      - name: Smoke-test DB server default timezone (UTC with no client-side SET)
        run: |
          # Issue #24 follow-up: distinct from tests/TimezonePinningTest.php,
          # which proves the app's own connections *request* UTC via
          # `SET time_zone`. This proves the *server's own default* is UTC
          # -- a connection would still get UTC here even if it somehow
          # lacked that explicit pin. No SET is issued in this query.
          #
          # MYSQL_PWD (not -p<password>) so the client doesn't emit its
          # "using a password on the command line" warning -- which would
          # otherwise land in this same captured output and break the
          # exact-match comparison below.
          TZ=$(MYSQL_PWD=root mysql -h 127.0.0.1 -P 3307 -u root --silent --skip-column-names -e "SELECT @@global.time_zone;")
          echo "Server @@global.time_zone: $TZ"
          [ "$TZ" = "+00:00" ]

      - name: Smoke-test SITE_URL correctness (self-links match the production URL exactly)
        run: |
          BODY=$(curl -sf "http://localhost:8081/api/v1/catalog.php?name=AO-91")
          echo "$BODY"
          SELF=$(echo "$BODY" | jq -r '.data[0].links.self')
          echo "Self link: $SELF"
          [ "$SELF" = "${SITE_URL}/api/v1/catalog.php?name=AO-91" ]

      - name: Smoke-test /api front door (real Apache, not the PHP dev server)
        # The PHPUnit harness can't exercise Apache config, so this is the
        # only check that the AliasMatch for bare /api and the api/index.php
        # COPY in api/Dockerfile actually work. Bare /api must answer 200
        # directly -- a 301 here means mod_dir is redirecting, which behind
        # Traefik becomes an http:// hop.
        run: |
          for P in /api /api/; do
            STATUS=$(curl -s -o /tmp/api-root.json -w "%{http_code}" "http://localhost:8081$P")
            echo "$P -> HTTP $STATUS"
            cat /tmp/api-root.json
            [ "$STATUS" = "200" ]
            jq -e --arg u "${SITE_URL}/api/v1/" '.data.versions[] | select(.version == "v1") | .url == $u' /tmp/api-root.json
          done
          # Build files must not be fetchable from the web root.
          for P in /api/Dockerfile /api/.dockerignore /api/v1/Dockerfile; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8081$P")
            echo "$P -> HTTP $STATUS"
            [ "$STATUS" = "404" ]
          done

      - name: Smoke-test SITE_URL portability (a different SITE_URL isn't hardcoded away)
        env:
          SITE_URL: https://example.org
        timeout-minutes: 5
        run: |
          docker compose up -d --wait
          BODY=$(curl -sf "http://localhost:8081/api/v1/catalog.php?name=AO-91")
          echo "$BODY"
          SELF=$(echo "$BODY" | jq -r '.data[0].links.self')
          echo "Self link: $SELF"
          [ "$SELF" = "${SITE_URL}/api/v1/catalog.php?name=AO-91" ]

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker network rm traefik-public || true
