services:
  frontend:
    image: amsatorg.azurecr.io/satellite-status-frontend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api/api/v1
    # Site banner: this image has no app-code bind mount (unlike local
    # dev), so content/ needs its own explicit mount. Resolves on the
    # deploy host to /opt/services/satellite-status/content/banner.md --
    # created and edited directly there, never shipped through git/CD.
    volumes:
      - ./content:/var/www/html/content:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.satellite-status-frontend.rule=Host(`status.amsat.org`)"
      - "traefik.http.routers.satellite-status-frontend.entrypoints=websecure"
      - "traefik.http.routers.satellite-status-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.satellite-status-frontend.priority=10"
      - "traefik.http.services.satellite-status-frontend.loadbalancer.server.port=80"

  api:
    image: amsatorg.azurecr.io/satellite-status-api:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.satellite-status-api.rule=Host(`status.amsat.org`) && PathPrefix(`/api`)"
      - "traefik.http.routers.satellite-status-api.entrypoints=websecure"
      - "traefik.http.routers.satellite-status-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.satellite-status-api.priority=20"
      - "traefik.http.services.satellite-status-api.loadbalancer.server.port=80"

  # api-v2 (TypeScript, docs/agents/api-v2-stack.md). Served at
  # status.amsat.org/api/v2. Its router outranks v1's PathPrefix(`/api`)
  # router (priority 20) with priority 30; everything else under /api
  # still goes to v1. No change needed in amsat-it-infra: Traefik picks
  # this up from the labels.
  api-v2:
    image: amsatorg.azurecr.io/satellite-status-api-v2:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The slim Node image has no curl.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v2/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.satellite-status-api-v2.rule=Host(`status.amsat.org`) && PathPrefix(`/api/v2`)"
      - "traefik.http.routers.satellite-status-api-v2.entrypoints=websecure"
      - "traefik.http.routers.satellite-status-api-v2.tls.certresolver=letsencrypt"
      - "traefik.http.routers.satellite-status-api-v2.priority=30"
      - "traefik.http.services.satellite-status-api-v2.loadbalancer.server.port=3000"

  db:
    image: mariadb:12.3
    restart: unless-stopped
    # Issue #24: server-level UTC default, as defense in depth alongside
    # the app's own per-connection `SET time_zone = '+00:00'` pinning --
    # see docker-compose.yml's identical setting for the full rationale.
    # This is the azure193 dockerized production DB; the separate legacy
    # dallas190 host is not dockerized and is not touched by this repo --
    # its global timezone config is handled by the project owner
    # directly on that host, outside this compose file/CD pipeline.
    command: --default-time-zone=+00:00
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mariadb", "-h", "127.0.0.1", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}", "--silent", "-e", "SELECT 1;"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:

networks:
  traefik-public:
    external: true
